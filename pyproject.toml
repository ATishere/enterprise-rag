[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Production-grade RAG platform: Hybrid + Graph RAG + RAGAS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "neo4j>=5.26.0",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3.0",
    "rank-bm25>=0.2.2",
    "anthropic>=0.39.0",
    "ragas>=0.2.15,<0.3",
    "langchain>=0.3,<1.0",
    "langchain-community>=0.3,<0.4",
    "langfuse>=2.54.0",
    "datasets>=3.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
