name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (Ruff)
        run: ruff check src tests scripts
      - name: Type check (MyPy)
        run: mypy src --ignore-missing-imports
      - name: Unit tests
        run: pytest --cov=enterprise_rag --cov-fail-under=55

  eval:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
    env:
      POSTGRES_URL: postgresql+asyncpg://user:pass@localhost:5432/rag
      NEO4J_URL: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Explain skipped evaluation when secrets are unavailable
        if: env.ANTHROPIC_API_KEY == '' || env.OPENAI_API_KEY == ''
        run: echo "::warning::RAGAS evaluation skipped; configure ANTHROPIC_API_KEY and OPENAI_API_KEY repository secrets."
      - name: Seed evaluation data
        if: env.ANTHROPIC_API_KEY != '' && env.OPENAI_API_KEY != ''
        run: python scripts/seed_eval_data.py
      - name: RAGAS evaluation (faithfulness hard gate)
        if: env.ANTHROPIC_API_KEY != '' && env.OPENAI_API_KEY != ''
        run: python scripts/run_eval.py --hard-gate faithfulness
